name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Manual re-build without a code change -- e.g. to pick up a new repo
  # variable (vars.NEXT_PUBLIC_CONVEX_URL etc.) that's build-time-baked and
  # can't take effect until the image is rebuilt.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build
        env:
          # Any reachable value works for the build/typecheck step.
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL_DEV || vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  # Convex functions and schema live in convex/ and are deployed to the Convex
  # backend, NOT baked into the Docker image -- the image only carries
  # NEXT_PUBLIC_CONVEX_URL pointing at it. Without this job they only ship when
  # someone remembers to push from their laptop, which is how the whole
  # courseImport module ended up missing from the backend while the UI calling
  # it was live ("Could not find public function for 'courseImport:applyImport'").
  #
  # The two environments use different Convex backends:
  #
  #   develop -> SELF-HOSTED, in-cluster (apps/bootcamp-platform/convex-selfhosted
  #              in orbital-k3s-gitops): convex-dev.nodrize.dev, authenticated
  #              with the admin key from the `convex-selfhosted` secret.
  #   main    -> CLOUD production deployment, authenticated with a deploy key.
  #
  # Self-hosted mode is selected by CONVEX_SELF_HOSTED_URL/_ADMIN_KEY, and the
  # cloud variables must be absent or the CLI prefers them -- same `env -u`
  # pattern as the convex-prod-to-dev-sync CronJob in the GitOps repo.
  convex:
    name: Deploy Convex functions
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy functions and schema to Convex
        env:
          # develop: self-hosted backend in the bootcamp-platform-dev namespace
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_SELF_HOSTED_URL || 'https://convex-dev.nodrize.dev' }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          # main: cloud production deployment
          CONVEX_DEPLOY_KEY_PROD: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -z "${CONVEX_DEPLOY_KEY_PROD:-}" ]; then
              echo "::warning::CONVEX_DEPLOY_KEY_PROD is not set -- skipping. Convex functions will NOT reach the production backend."
              exit 0
            fi
            echo "Deploying to the cloud production deployment."
            CONVEX_DEPLOY_KEY="$CONVEX_DEPLOY_KEY_PROD" npx convex deploy --yes
          else
            if [ -z "${CONVEX_SELF_HOSTED_ADMIN_KEY:-}" ]; then
              echo "::warning::CONVEX_SELF_HOSTED_ADMIN_KEY is not set -- skipping. Convex functions will NOT reach the self-hosted dev backend, and the app will fail with \"Could not find public function\"."
              echo "::warning::Get it with: kubectl -n bootcamp-platform-dev get secret convex-selfhosted -o jsonpath='{.data.ADMIN_KEY}' | base64 -d"
              exit 0
            fi
            echo "Deploying to the self-hosted dev backend at $CONVEX_SELF_HOSTED_URL"
            # Cloud credentials must not be in scope or the CLI uses them
            # instead of the self-hosted target.
            env -u CONVEX_DEPLOY_KEY -u CONVEX_DEPLOYMENT \
              CONVEX_SELF_HOSTED_URL="$CONVEX_SELF_HOSTED_URL" \
              CONVEX_SELF_HOSTED_ADMIN_KEY="$CONVEX_SELF_HOSTED_ADMIN_KEY" \
              npx convex deploy --yes
          fi

  image:
    name: Build & push image
    needs: [test, convex]
    # Only push on an actual commit to develop or main, never for pull requests.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      env_tag: ${{ steps.vars.outputs.env_tag }}
      pinned_tag: ${{ steps.vars.outputs.pinned_tag }}
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; github.repository preserves case.
      # develop -> :develop (bootcamp-platform-dev), main -> :prod
      # (bootcamp-platform-prod) -- see orbital-k3s-gitops apps/bootcamp-platform/.
      # Each also gets a SHA-pinned tag (<env>-<short-sha>) so a specific build
      # is individually addressable/promotable, not just "whatever :develop
      # currently points to". ENV_TAG/APP_ENV also drive the dev banner /
      # noindex / Clarity gating baked into the image (utils/env.ts) --
      # NEXT_PUBLIC_* vars are build-time, not runtime. APP_COMMIT feeds the
      # footer version tag (utils/version.ts) -- short sha on dev, blank on
      # prod for a clean footer.
      - name: Compute build variables
        id: vars
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_TAG=prod
            APP_ENV=production
            APP_COMMIT=""
          else
            ENV_TAG=develop
            APP_ENV=development
            APP_COMMIT="$SHORT_SHA"
          fi
          {
            echo "image_name=$IMAGE_NAME"
            echo "short_sha=$SHORT_SHA"
            echo "env_tag=$ENV_TAG"
            echo "app_env=$APP_ENV"
            echo "app_commit=$APP_COMMIT"
            echo "pinned_tag=${ENV_TAG}-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            # Baked into the image at build time, so it MUST match the branch's
            # backend: develop runs against the self-hosted in-cluster Convex,
            # main against cloud production. A single shared variable would ship
            # a production image pointing at the dev backend.
            NEXT_PUBLIC_CONVEX_URL=${{ github.ref == 'refs/heads/main' && (vars.NEXT_PUBLIC_CONVEX_URL_PROD || vars.NEXT_PUBLIC_CONVEX_URL) || (vars.NEXT_PUBLIC_CONVEX_URL_DEV || vars.NEXT_PUBLIC_CONVEX_URL) }}
            NEXT_PUBLIC_APP_ENV=${{ steps.vars.outputs.app_env }}
            NEXT_PUBLIC_APP_COMMIT=${{ steps.vars.outputs.app_commit }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ steps.vars.outputs.env_tag == 'prod' && vars.NEXT_PUBLIC_CLARITY_PROJECT_ID || '' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.env_tag }}
            ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.pinned_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-dev:
    name: Promote to bootcamp-platform-dev (GitOps)
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      # GITOPS_PAT: a fine-grained PAT scoped to CleveritDemo/orbital-k3s-gitops
      # only, "Contents: Read and write" permission. See
      # architecture-roadmap/kubernetes-deployment-runbook.md for setup.
      - name: Check GITOPS_PAT is configured
        id: check
        run: |
          if [ -n "${{ secrets.GITOPS_PAT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITOPS_PAT secret not set -- skipping auto-promotion to bootcamp-platform-dev. See architecture-roadmap/kubernetes-deployment-runbook.md."
          fi

      - name: Checkout orbital-k3s-gitops
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: CleveritDemo/orbital-k3s-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump dev image tag and push
        if: steps.check.outputs.configured == 'true'
        working-directory: gitops
        run: |
          set -euo pipefail
          FILE=apps/bootcamp-platform/workloads/overlays/dev/kustomization.yaml
          NEW_TAG="${{ needs.image.outputs.pinned_tag }}"
          sed -i "s#newTag: develop.*#newTag: ${NEW_TAG}#" "$FILE"
          grep -q "newTag: ${NEW_TAG}\$" "$FILE" || { echo "::error::failed to update $FILE"; exit 1; }

          git config user.name "bootcamp-platform-ci"
          git config user.email "actions@github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Already up to date at ${NEW_TAG}"
          else
            git commit -m "chore(bootcamp-platform): promote dev to ${NEW_TAG}"
            git push origin main
          fi

  promote-prod:
    name: Promote to bootcamp-platform-prod (GitOps)
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check GITOPS_PAT is configured
        id: check
        run: |
          if [ -n "${{ secrets.GITOPS_PAT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITOPS_PAT secret not set -- skipping auto-promotion to bootcamp-platform-prod. See architecture-roadmap/kubernetes-deployment-runbook.md."
          fi

      - name: Checkout orbital-k3s-gitops
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: CleveritDemo/orbital-k3s-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump prod image tag and push
        if: steps.check.outputs.configured == 'true'
        working-directory: gitops
        run: |
          set -euo pipefail
          FILE=apps/bootcamp-platform/workloads/overlays/prod/kustomization.yaml
          NEW_TAG="${{ needs.image.outputs.pinned_tag }}"
          sed -i "s#newTag: prod.*#newTag: ${NEW_TAG}#" "$FILE"
          grep -q "newTag: ${NEW_TAG}\$" "$FILE" || { echo "::error::failed to update $FILE"; exit 1; }

          git config user.name "bootcamp-platform-ci"
          git config user.email "actions@github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Already up to date at ${NEW_TAG}"
          else
            git commit -m "chore(bootcamp-platform): promote prod to ${NEW_TAG}"
            git push origin main
          fi
