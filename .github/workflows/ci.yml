name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  image:
    name: Build & push image
    needs: test
    # Only push on an actual commit to develop or main, never for pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; github.repository preserves case.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # develop -> :develop (deployed to bootcamp-platform-dev), main -> :prod
      # (deployed to bootcamp-platform-prod). See orbital-k3s-gitops
      # apps/bootcamp-platform/ for the k8s side of this mapping. Also drives
      # the dev banner / noindex / Clarity gating baked into the image
      # (utils/env.ts) -- NEXT_PUBLIC_* vars are build-time, not runtime.
      - name: Compute environment tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_TAG=prod" >> "$GITHUB_ENV"
            echo "APP_ENV=production" >> "$GITHUB_ENV"
          else
            echo "ENV_TAG=develop" >> "$GITHUB_ENV"
            echo "APP_ENV=development" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
            NEXT_PUBLIC_APP_ENV=${{ env.APP_ENV }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ env.ENV_TAG == 'prod' && vars.NEXT_PUBLIC_CLARITY_PROJECT_ID || '' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
