name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Manual re-build without a code change -- e.g. to pick up a new repo
  # variable (vars.NEXT_PUBLIC_CONVEX_URL etc.) that's build-time-baked and
  # can't take effect until the image is rebuilt.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  # Convex functions and schema live in convex/ and are deployed to the Convex
  # backend, NOT baked into the Docker image -- the image only carries the
  # NEXT_PUBLIC_CONVEX_URL pointing at it. Without this job they only ever ship
  # when someone remembers to run `npx convex dev --once` from their laptop,
  # which is how courseImport:* ended up missing in the backend while the app
  # code that calls it was live (the UI then fails with
  # "Could not find public function for 'courseImport:applyImport'").
  #
  # Gated on the secret so a fork or an unconfigured repo skips cleanly rather
  # than failing the pipeline -- same pattern as the GitOps promote jobs below.
  convex:
    name: Deploy Convex functions
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # develop and main target different Convex deployments, so each has its
      # own secret. The key type also decides the command -- `convex deploy`
      # targets production and is NOT correct for a dev deployment; a `dev:` key
      # is used with `convex dev --once` (docs.convex.dev/cli/deploy-key-types).
      #
      # Both keys are read as env vars and never pass through step outputs, so
      # neither is written anywhere a later step could echo.
      - name: Deploy functions and schema to Convex
        env:
          CONVEX_DEPLOY_KEY_DEV: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          CONVEX_DEPLOY_KEY_PROD: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            KEY="${CONVEX_DEPLOY_KEY_PROD:-}"
            WHICH="CONVEX_DEPLOY_KEY_PROD"
          else
            KEY="${CONVEX_DEPLOY_KEY_DEV:-}"
            WHICH="CONVEX_DEPLOY_KEY_DEV"
          fi

          if [ -z "$KEY" ]; then
            echo "::warning::$WHICH is not set -- skipping Convex deploy. Functions in convex/ will NOT reach the backend, and the app may call functions that do not exist there."
            exit 0
          fi

          export CONVEX_DEPLOY_KEY="$KEY"
          case "${KEY%%:*}" in
            prod)
              echo "Deploying to the production deployment."
              npx convex deploy --yes
              ;;
            dev)
              # `convex deploy` would target production; a dev deployment is
              # pushed to with `convex dev --once`.
              echo "Pushing to the development deployment."
              npx convex dev --once
              ;;
            *)
              echo "::error::$WHICH is not a recognised Convex deploy key (expected it to start with 'prod:' or 'dev:')."
              exit 1
              ;;
          esac

  image:
    name: Build & push image
    needs: [test, convex]
    # Only push on an actual commit to develop or main, never for pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      env_tag: ${{ steps.vars.outputs.env_tag }}
      pinned_tag: ${{ steps.vars.outputs.pinned_tag }}
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; github.repository preserves case.
      # develop -> :develop (bootcamp-platform-dev), main -> :prod
      # (bootcamp-platform-prod) -- see orbital-k3s-gitops apps/bootcamp-platform/.
      # Each also gets a SHA-pinned tag (<env>-<short-sha>) so a specific build
      # is individually addressable/promotable, not just "whatever :develop
      # currently points to". ENV_TAG/APP_ENV also drive the dev banner /
      # noindex / Clarity gating baked into the image (utils/env.ts) --
      # NEXT_PUBLIC_* vars are build-time, not runtime. APP_COMMIT feeds the
      # footer version tag (utils/version.ts) -- short sha on dev, blank on
      # prod for a clean footer.
      - name: Compute build variables
        id: vars
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_TAG=prod
            APP_ENV=production
            APP_COMMIT=""
          else
            ENV_TAG=develop
            APP_ENV=development
            APP_COMMIT="$SHORT_SHA"
          fi
          {
            echo "image_name=$IMAGE_NAME"
            echo "short_sha=$SHORT_SHA"
            echo "env_tag=$ENV_TAG"
            echo "app_env=$APP_ENV"
            echo "app_commit=$APP_COMMIT"
            echo "pinned_tag=${ENV_TAG}-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
            NEXT_PUBLIC_APP_ENV=${{ steps.vars.outputs.app_env }}
            NEXT_PUBLIC_APP_COMMIT=${{ steps.vars.outputs.app_commit }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ steps.vars.outputs.env_tag == 'prod' && vars.NEXT_PUBLIC_CLARITY_PROJECT_ID || '' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.env_tag }}
            ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.pinned_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-dev:
    name: Promote to bootcamp-platform-dev (GitOps)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      # GITOPS_PAT: a fine-grained PAT scoped to CleveritDemo/orbital-k3s-gitops
      # only, "Contents: Read and write" permission. See
      # architecture-roadmap/kubernetes-deployment-runbook.md for setup.
      - name: Check GITOPS_PAT is configured
        id: check
        run: |
          if [ -n "${{ secrets.GITOPS_PAT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITOPS_PAT secret not set -- skipping auto-promotion to bootcamp-platform-dev. See architecture-roadmap/kubernetes-deployment-runbook.md."
          fi

      - name: Checkout orbital-k3s-gitops
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: CleveritDemo/orbital-k3s-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump dev image tag and push
        if: steps.check.outputs.configured == 'true'
        working-directory: gitops
        run: |
          set -euo pipefail
          FILE=apps/bootcamp-platform/workloads/overlays/dev/kustomization.yaml
          NEW_TAG="${{ needs.image.outputs.pinned_tag }}"
          sed -i "s#newTag: develop.*#newTag: ${NEW_TAG}#" "$FILE"
          grep -q "newTag: ${NEW_TAG}\$" "$FILE" || { echo "::error::failed to update $FILE"; exit 1; }

          git config user.name "bootcamp-platform-ci"
          git config user.email "actions@github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Already up to date at ${NEW_TAG}"
          else
            git commit -m "chore(bootcamp-platform): promote dev to ${NEW_TAG}"
            git push origin main
          fi

  promote-prod:
    name: Promote to bootcamp-platform-prod (GitOps)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check GITOPS_PAT is configured
        id: check
        run: |
          if [ -n "${{ secrets.GITOPS_PAT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITOPS_PAT secret not set -- skipping auto-promotion to bootcamp-platform-prod. See architecture-roadmap/kubernetes-deployment-runbook.md."
          fi

      - name: Checkout orbital-k3s-gitops
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: CleveritDemo/orbital-k3s-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump prod image tag and push
        if: steps.check.outputs.configured == 'true'
        working-directory: gitops
        run: |
          set -euo pipefail
          FILE=apps/bootcamp-platform/workloads/overlays/prod/kustomization.yaml
          NEW_TAG="${{ needs.image.outputs.pinned_tag }}"
          sed -i "s#newTag: prod.*#newTag: ${NEW_TAG}#" "$FILE"
          grep -q "newTag: ${NEW_TAG}\$" "$FILE" || { echo "::error::failed to update $FILE"; exit 1; }

          git config user.name "bootcamp-platform-ci"
          git config user.email "actions@github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Already up to date at ${NEW_TAG}"
          else
            git commit -m "chore(bootcamp-platform): promote prod to ${NEW_TAG}"
            git push origin main
          fi
